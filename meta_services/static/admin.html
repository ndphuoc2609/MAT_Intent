<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý Meta Page</title>
    <link rel="stylesheet" href="/static/admin.css">
    <script defer src="/static/admin.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">META SERVICES</p>
        <h1>Quản lý Page</h1>
      </div>
      <a href="/docs">API docs</a>
    </header>

    <main>
      <section id="auth-panel" class="panel auth-panel">
        <h2>Kết nối dịch vụ</h2>
        <p>Nhập service API key để xem bài viết, comment, inbox và ca cần duyệt.</p>
        <form id="api-key-form">
          <label for="api-key">Service API key</label>
          <div class="inline-form">
            <input id="api-key" type="password" autocomplete="off" required>
            <button type="submit">Kết nối</button>
          </div>
        </form>
      </section>

      <p id="notice" role="status" aria-live="polite"></p>

      <section id="dashboard" hidden>
        <section class="status-panel" aria-live="polite">
          <div>
            <p class="eyebrow">TRẠNG THÁI</p>
            <p id="service-status">Đang kiểm tra…</p>
          </div>
          <button id="refresh-all" type="button">Tải lại dữ liệu</button>
        </section>

        <div class="workspace-grid">
          <section class="panel">
            <div class="section-heading">
              <div>
                <p class="eyebrow">PAGE</p>
                <h2>Bài viết</h2>
              </div>
              <button id="load-posts" type="button">Tải bài</button>
            </div>
            <div id="posts-list" class="record-list"></div>
            <button id="more-posts" class="secondary" type="button" hidden>Tải thêm bài</button>
          </section>

          <section class="panel">
            <div class="section-heading">
              <div>
                <p class="eyebrow">BÌNH LUẬN</p>
                <h2 id="comments-title">Chọn một bài viết</h2>
              </div>
              <button id="more-comments" class="secondary" type="button" hidden>Tải thêm</button>
            </div>
            <div id="comments-list" class="record-list"></div>
            <form id="reply-form" class="write-form" hidden>
              <label id="reply-target" for="reply-message">Trả lời comment</label>
              <textarea id="reply-message" rows="3" maxlength="10000" required></textarea>
              <button id="reply-submit" data-write type="submit" disabled>Gửi trả lời</button>
            </form>
          </section>

          <section class="panel">
            <div class="section-heading">
              <div>
                <p class="eyebrow">XỬ LÝ</p>
                <h2>Inbox</h2>
              </div>
              <button id="load-inbox" type="button">Tải lại</button>
            </div>
            <div id="inbox-list" class="record-list"></div>
          </section>

          <section class="panel">
            <div class="section-heading">
              <div>
                <p class="eyebrow">NHÂN VIÊN DUYỆT</p>
                <h2>Review drafts</h2>
              </div>
              <button id="load-reviews" type="button">Tải lại</button>
            </div>
            <div id="reviews-list" class="record-list"></div>
          </section>

          <section class="panel publish-panel">
            <p class="eyebrow">ĐĂNG PAGE</p>
            <h2>Tạo bài viết</h2>
            <form id="publish-form" class="write-form">
              <label for="post-message">Nội dung</label>
              <textarea id="post-message" rows="4" maxlength="63000" required></textarea>
              <label for="post-link">Link HTTPS (không bắt buộc)</label>
              <input id="post-link" type="url" placeholder="https://…">
              <button data-write type="submit" disabled>Đăng bài</button>
            </form>
          </section>
        </div>
      </section>
    </main>
  </body>
</html>
